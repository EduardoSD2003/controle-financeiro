<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farofa Fin — Entrar</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg?v=12" />
  <link rel="stylesheet" href="css/style.css?v=12" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="auth-logo"><img src="assets/logo.svg?v=12" alt="" class="logo-img" /> Farofa Fin</h1>

    <div class="tabs" id="auth-tabs">
      <button class="tab-btn active" data-tab="login">Entrar</button>
      <button class="tab-btn" data-tab="signup">Criar conta</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>
        Email
        <input type="email" id="login-email" required autocomplete="email" />
      </label>
      <label>
        Senha
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <label>
        Nome
        <input type="text" id="signup-name" required autocomplete="name" />
      </label>
      <label>
        Email
        <input type="email" id="signup-email" required autocomplete="email" />
      </label>
      <label>
        Senha
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>

    <p id="auth-message" class="auth-message hidden"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=12"></script>
  <script src="js/supabaseClient.js?v=12"></script>
  <script src="js/login.js?v=12"></script>
</body>
</html>
